<svg xmlns="http://www.w3.org/2000/svg" width="360" height="40" viewBox="0 0 360 40" role="img" aria-label="02 / Stack">
<style>
  .h{font-family:'Space Grotesk','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .m{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;text-transform:uppercase}
  .rule{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
  .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<text class="m" x="0" y="16" font-size="13" letter-spacing="2.2" fill="#908b7d">02 / Stack</text>
<rect class="rule" style="animation-delay:0.15s" x="0" y="30" width="40" height="2" fill="#f0613d"/>
</svg>
